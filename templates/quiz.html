<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Smart Quiz Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎓 Smart Quiz Generator</span>
            <div>
                <a href="{{ url_for('categories') }}" class="btn btn-outline-warning btn-sm me-2">← Back</a>
                <a href="{{ url_for('index') }}" class="btn btn-outline-light btn-sm">Home</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Progress Bar -->
        <div class="progress mb-4" style="height: 6px;">
            <div class="progress-bar bg-success" style="width: {{ progress_percent }}%;"></div>
        </div>

        <!-- Question Counter -->
        <div class="text-center mb-3">
            <span class="badge bg-primary">Question {{ question_number }} of {{ total_questions }}</span>
        </div>

        <!-- Question Card -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 mb-4">
                    <div class="card-body p-5">
                        <h2 class="card-title mb-4">{{ question['question'] }}</h2>

                        <!-- Options -->
                        <div id="options-container">
                            {% for option in question['options'] %}
                            <div class="form-check option-box mb-3">
                                <input class="form-check-input option-input" type="radio" name="answer" 
                                       id="option{{ loop.index }}" value="{{ option }}">
                                <label class="form-check-label" for="option{{ loop.index }}">
                                    {{ option }}
                                </label>
                            </div>
                            {% endfor %}
                        </div>

                        <!-- Feedback (hidden initially) -->
                        <div id="feedback" class="alert mt-4" style="display: none;"></div>

                        <!-- Buttons -->
                        <div class="d-grid gap-2 mt-5">
                            <button class="btn btn-lg btn-primary" id="submit-btn" onclick="submitAnswer()">
                                Submit Answer
                            </button>
                            <button class="btn btn-lg btn-success" id="next-btn" onclick="nextQuestion()" 
                                    style="display: none;">
                                Next Question ➜
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>&copy; 2025 Smart Quiz Generator. Roshni. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let answered = false;

        function submitAnswer() {
            if (answered) return;

            const selectedOption = document.querySelector('input[name="answer"]:checked');
            
            if (!selectedOption) {
                alert('Please select an option!');
                return;
            }

            answered = true;
            const answer = selectedOption.value;

            fetch('/api/submit-answer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ answer: answer })
            })
            .then(response => response.json())
            .then(data => {
                const feedbackDiv = document.getElementById('feedback');
                const submitBtn = document.getElementById('submit-btn');
                const nextBtn = document.getElementById('next-btn');

                feedbackDiv.style.display = 'block';
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'block';

                if (data.is_correct) {
                    feedbackDiv.className = 'alert alert-success';
                    feedbackDiv.innerHTML = `
                        <h5>✅ Correct!</h5>
                        <p class="mb-0"><strong>Explanation:</strong> ${data.explanation}</p>
                    `;
                } else {
                    feedbackDiv.className = 'alert alert-danger';
                    feedbackDiv.innerHTML = `
                        <h5>❌ Wrong!</h5>
                        <p><strong>Your Answer:</strong> ${selectedOption.value}</p>
                        <p><strong>Correct Answer:</strong> ${data.correct_answer}</p>
                        <p class="mb-0"><strong>Explanation:</strong> ${data.explanation}</p>
                    `;
                }

                // Disable options after answering
                document.querySelectorAll('.option-input').forEach(input => {
                    input.disabled = true;
                });
            });
        }

        function nextQuestion() {
            fetch('/api/next-question', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    location.reload();
                }
            });
        }
    </script>
</body>
</html>
