<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Smart Quiz Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">🎓 Smart Quiz Generator</span>
            <div>
                <a href="{{ url_for('categories') }}" class="btn btn-outline-warning btn-sm me-2">← Categories</a>
                <a href="{{ url_for('index') }}" class="btn btn-outline-light btn-sm">Home</a>
            </div>
        </div>
    </nav>

    <div class="container py-4 flex-grow-1">
        <!-- Progress Bar -->
        <div class="progress mb-4" style="height: 8px;">
            <div class="progress-bar" style="width: {{ progress_percent }}%;"></div>
        </div>

        <!-- Question Counter -->
        <div class="text-center mb-4">
            <span class="badge bg-primary">Question {{ question_number }} of {{ total_questions }}</span>
        </div>

        <!-- Question Card -->
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                <div class="card shadow-lg border-0 mb-4">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="card-title mb-4">Q{{ question_number }}. {{ question['question'] }}</h2>

                        <!-- Options -->
                        <div id="options-container" class="mb-4">
                            {% for option in question['options'] %}
                            <div class="option-box mb-3" onclick="document.getElementById('option{{ loop.index }}').checked = true;">
                                <input class="form-check-input option-input" type="radio" name="answer" 
                                       id="option{{ loop.index }}" value="{{ option }}">
                                <label class="form-check-label" for="option{{ loop.index }}">
                                    {{ option }}
                                </label>
                            </div>
                            {% endfor %}
                        </div>

                        <!-- Feedback (hidden initially) -->
                        <div id="feedback" class="alert mt-4" style="display: none;"></div>

                        <!-- Buttons -->
                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-lg btn-primary py-3" id="submit-btn" onclick="submitAnswer()">
                                Submit Answer
                            </button>
                            <button class="btn btn-lg btn-success py-3" id="next-btn" onclick="nextQuestion()" 
                                    style="display: none;">
                                Next Question ➜
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-auto">
        <p class="mb-0">&copy; 2025 Smart Quiz Generator. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let answered = false;

        function submitAnswer() {
            if (answered) return;

            const selectedOption = document.querySelector('input[name="answer"]:checked');
            
            if (!selectedOption) {
                alert('Please select an option!');
                return;
            }

            answered = true;
            const answer = selectedOption.value;

            fetch('/api/submit-answer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ answer: answer })
            })
            .then(response => response.json())
            .then(data => {
                const feedbackDiv = document.getElementById('feedback');
                const submitBtn = document.getElementById('submit-btn');
                const nextBtn = document.getElementById('next-btn');

                feedbackDiv.style.display = 'block';
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'block';

                if (data.is_correct) {
                    feedbackDiv.className = 'alert alert-success';
                    feedbackDiv.innerHTML = `
                        <h5 class="fw-bold mb-2">✅ Correct!</h5>
                        <p class="mb-0"><strong>Explanation:</strong> ${data.explanation}</p>
                    `;
                } else {
                    feedbackDiv.className = 'alert alert-danger';
                    feedbackDiv.innerHTML = `
                        <h5 class="fw-bold mb-2">❌ Wrong!</h5>
                        <p class="mb-1"><strong>Your Answer:</strong> ${selectedOption.value}</p>
                        <p class="mb-1"><strong>Correct Answer:</strong> ${data.correct_answer}</p>
                        <p class="mb-0 mt-2"><strong>Explanation:</strong> ${data.explanation}</p>
                    `;
                }

                // Disable options after answering
                document.querySelectorAll('.option-input').forEach(input => {
                    input.disabled = true;
                });
                
                // Scroll down to feedback if needed
                feedbackDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        }

        function nextQuestion() {
            fetch('/api/next-question', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    location.reload();
                }
            });
        }
    </script>
</body>
</html>
