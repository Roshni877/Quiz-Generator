<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Category - Quiz Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎓 Smart Quiz Generator</span>
            <a href="{{ url_for('index') }}" class="btn btn-outline-light">← Home</a>
        </div>
    </nav>

    <div class="container py-5">
        <h1 class="text-center mb-5">Select a Category</h1>
        
        <div class="row">
            {% for category in categories %}
            <div class="col-md-6 col-lg-4 mb-4">
                <a href="{{ url_for('start_quiz', category=category) }}" class="category-card">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body text-center">
                            <h5 class="card-title">{{ category.capitalize() }}</h5>
                            <p class="card-text text-muted">Start a 10-question quiz</p>
                            <button class="btn btn-primary btn-sm mt-3">Begin ➜</button>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>&copy; 2025 Smart Quiz Generator. Roshni. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
