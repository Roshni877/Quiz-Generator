<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Category - Smart Quiz Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">🎓 Smart Quiz Generator</span>
            <a href="{{ url_for('index') }}" class="btn btn-outline-light">← Home</a>
        </div>
    </nav>

    <div class="container py-5 flex-grow-1">
        <h1 class="text-center fw-bold mb-2">Select Quiz Category</h1>
        <p class="text-center text-muted mb-5">Choose a topic to jump straight into instant 10-question practice</p>
        
        <div class="row g-4">
            {% for category in categories %}
            <div class="col-md-6 col-lg-4">
                <a href="{{ url_for('start_quiz', category=category) }}" class="category-card h-100">
                    <div class="card h-100 shadow-sm p-3">
                        <div class="card-body text-center d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="card-title text-capitalize mb-2">📚 {{ category }}</h5>
                                <p class="card-text text-muted small">10 Instant Questions</p>
                            </div>
                            <button class="btn btn-primary btn-sm mt-3 w-100 py-2 fw-bold">Begin Quiz ➜</button>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>

    <footer class="text-center py-4 mt-auto">
        <p class="mb-0">&copy; 2025 Smart Quiz Generator. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
